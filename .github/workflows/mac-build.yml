# 맥 판을 GitHub 의 맥 머신에서 빌드한다 — Windows 에서도 맥 판 컴파일·화면을 확인할 수 있게.
#   손으로: gh workflow run mac-build.yml  →  gh run watch  →  gh run download -n mac-build
#   자동: mac/·i18n/ 을 바꾼 push 마다
# 결과(artifact mac-build): 설치 묶음 zip(package.sh 와 같은 것, 임시 서명), 창·메뉴 막대 게이지 캡처(예시 값)
# 공개 저장소라 GitHub 의 맥 머신은 무료다. 올리기(release.sh mac)는 하지 않는다.
name: mac-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mac/**", "i18n/**", ".github/workflows/mac-build.yml"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 컴파일
        run: |
          swiftc --version
          swiftc -O -swift-version 5 -parse-as-library mac/AIUsagePet.swift -o AIUsagePet

      - name: 화면 캡처(예시 값)
        run: |
          mkdir -p shots
          ./AIUsagePet --snapshot shots/window.png --sample
          ./AIUsagePet --snapshot shots/window-folded.png --sample --fold
          ./AIUsagePet --snapshot shots/session-panel.png --sample --panel
          ./AIUsagePet --gauge-snapshot shots/menubar-gauge.png
          ls -l shots

      - name: 설치 묶음
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' mac/Info.plist)
          zsh mac/package.sh "$PWD/AIUsage-mac-$version.zip"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            AIUsage-mac-*.zip
            shots/
          retention-days: 14
