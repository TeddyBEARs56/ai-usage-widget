# 맥 판 새 판을 GitHub 의 맥 머신에서 만들어 Releases 에 올린다 — 맥이 없어도(Windows 에서도) 올릴 수 있게.
#   gh workflow run mac-release.yml -f notes="바뀐 점"   →   gh run watch
# 하는 일은 맥에서 zsh release.sh mac "바뀐 점" 과 같다: 버전 검사(같은·낮은 버전이면 멈춤) → 설치 묶음 zip → Releases 에 mac-v<버전>.
# README 받기 링크 커밋은 하지 않는다(AIUSAGE_SKIP_README) — 올린 뒤 사람이 자기 이름으로 커밋한다.
# 먼저 mac/Info.plist 의 버전(CFBundleShortVersionString·CFBundleVersion)을 올려 main 에 push 해 둔다.
name: mac-release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "바뀐 점(릴리스 설명)"
        required: false
        default: ""

permissions:
  contents: write  # 릴리스 만들기

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 올리기(release.sh mac)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          AIUSAGE_SKIP_README: "1"
        run: zsh release.sh mac "$NOTES"
